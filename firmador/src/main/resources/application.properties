spring.application.name=firmador
server.port=${FIRMADOR_PUERTO:8081}
# Solo escucha en la propia máquina: Laravel es el único cliente
server.address=${FIRMADOR_HOST:127.0.0.1}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1

# Clave compartida con Laravel (FIRMADOR_API_KEY en backend/.env)
firmador.api-key=${FIRMADOR_API_KEY:clave-local-firmador-inf513}

# Carpeta donde se guardan la AC de prueba, el sello institucional y los .p12 de cada firmante
firmador.directorio-datos=${FIRMADOR_DATOS:./datos}
# Contraseña del almacén de la AC raíz y del sello institucional (no la conocen los firmantes)
firmador.clave-ac=${FIRMADOR_CLAVE_AC:ac-prueba-uagrm-2026}
firmador.ubicacion-por-defecto=Santa Cruz de la Sierra, Bolivia
